log_format main_with_headers '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             '"$http_x_forwarded_for"';

access_log /var/log/nginx/access.log main_with_headers;
access_log /dev/stdout main_with_headers;
error_log /var/log/nginx/error.log warn;
error_log /dev/stderr warn;

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/cert.crt;
    ssl_certificate_key /etc/nginx/certs/cert.key;

    root /var/www/html;
    index index.html;

    # Favicon
    location = /favicon.ico {
        # Disable access logging for this location
        access_log off;
        alias /nginx/favicon.ico;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # don't send the nginx version number in error pages and Server header
    server_tokens off;
}
